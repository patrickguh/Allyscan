<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sky" data-buttons="tonal" data-motion
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:replace="~{fragments/site :: assets}"></th:block>
<title>Allyscan: sign up</title>
<meta name="description" content="Create a free Allyscan account to keep a private, permanent scan history.">
</head>
<body>
<header th:replace="~{fragments/site :: nav(current='login')}"></header>

<main id="top">
  <div class="page">
    <div class="wrap">
      <div class="split-2">
        <div class="page-head">
          <h1>Create an account</h1>
          <p>Free. Every scan you run while signed in is kept, private to you. Scans without an account are shown once and deleted an hour later.</p>
        </div>
        <div class="box stack narrow">
          <div class="notice notice--error" role="alert" th:if="${error}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2v.1"/></svg><p th:text="${error}">Something went wrong.</p></div>
          <form method="post" th:action="@{/register}" class="form form--1" aria-label="Create an account">
            <div class="field field--full">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" th:value="${email}" required autofocus autocomplete="email" data-error="Write an email address with an @">
            </div>
            <div class="field field--full">
              <label for="password">Password, 8 characters or more</label>
              <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" data-error="Use at least 8 characters">
            </div>
            <div class="field field--full">
              <label for="confirm-password">Confirm password</label>
              <input type="password" id="confirm-password" name="confirm-password" required minlength="8" autocomplete="new-password" data-error="Type the same password again">
            </div>
            <div class="btn-row"><button class="btn btn--primary btn--block" type="submit">Sign up</button></div>
            <p class="form__status" data-form-status></p>
          </form>
          <p class="empty">Already have an account? <a href="/login">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/site :: foot}"></footer>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
</body>
</html>
