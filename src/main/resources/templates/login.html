<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sky" data-buttons="tonal" data-motion
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:replace="~{fragments/site :: assets}"></th:block>
<title>Allyscan: log in</title>
<meta name="description" content="Log in to Allyscan to see your private scan history.">
</head>
<body>
<header th:replace="~{fragments/site :: nav(current='login')}"></header>

<main id="top">
  <div class="page">
    <div class="wrap">
      <div class="split-2">
        <div class="page-head">
          <h1>Log in</h1>
          <p>Your scans stay in your account, private to you, for as long as you keep it.</p>
        </div>
        <div class="box stack narrow">
          <div class="notice" role="status" th:if="${registered}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.4 2.8 2.8 6.2-6.4"/></svg><p>Account created. Log in below.</p></div>
          <div class="notice" role="status" th:if="${passwordReset}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.4 2.8 2.8 6.2-6.4"/></svg><p>Password updated. Log in below.</p></div>
          <div class="notice notice--error" role="alert" th:if="${param.error}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2v.1"/></svg><p>Incorrect email or password.</p></div>
          <form method="post" th:action="@{/login}" class="form form--1" aria-label="Log in">
            <div class="field field--full">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required autofocus autocomplete="email" data-error="Write the email you signed up with">
            </div>
            <div class="field field--full">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required autocomplete="current-password" data-error="Write your password">
            </div>
            <label class="check field--full" for="remember-me"><input type="checkbox" id="remember-me" name="remember-me"> Keep me signed in on this device</label>
            <div class="btn-row"><button class="btn btn--primary btn--block" type="submit">Log in</button></div>
            <p class="form__status" data-form-status></p>
          </form>
          <p class="empty"><a href="/forgot-password">Forgot your password?</a></p>
          <p class="empty">No account yet? <a href="/register">Sign up</a></p>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/site :: foot}"></footer>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
</body>
</html>
