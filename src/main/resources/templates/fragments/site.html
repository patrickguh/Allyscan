<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<!-- assets: everything every page's head loads, in the kit's order (Taste Skill system.md). A page adds its
     <title>, its description and its own stylesheet after this block. -->
<th:block th:fragment="assets">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%235ab9fc'/%3E%3Cpath d='M4 17h4l3-8h6l3 8' stroke='%230a0d14' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
<meta name="theme-color" content="#0a0d14">
<!-- the grade: dark by default; light when chosen in Settings (or "System" on a light OS), set once on load -->
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'||t==='system'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<!-- touch the CSRF token before the body streams out: forms lower on the page need the session it creates -->
<meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
<meta name="site-kind" content="software">
<meta name="page-type" content="software">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/system.css">
<link rel="stylesheet" href="/assets/ui/cards.css">
<link rel="stylesheet" href="/assets/motion/motion.css">
<link rel="stylesheet" href="/assets/backgrounds/backgrounds.css">
<link rel="stylesheet" href="/assets/layout/layout.css">
<link rel="stylesheet" href="/assets/icons/icon.css">
<style>
:root {
  --p-bg: #0a0d14; --p-surface: #131824; --p-ink: #e9edf3; --p-muted: #8891a1;
  --p-accent: #5ab9fc; --p-accent-ink: #0a0d14; --p-action: #5ab9fc; --p-action-ink: #0a0d14;
  --p-inv-bg: #e9edf3; --p-inv-surface: #d7dbe1; --p-inv-ink: #0a0d14; --p-inv-muted: #54575f;
  --p-inv-accent: #0a0d14; --p-inv-accent-ink: #e9edf3; --p-inv-action: #0a0d14; --p-inv-action-ink: #e9edf3;
  --font-display: "Host Grotesk", system-ui, sans-serif;
  --font-text: "Host Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display-weight: 500;
  --display-tracking: -0.035em;
  --display-tracking-xl: -0.04em;
}
</style>
<link rel="stylesheet" href="/assets/ui/base.css">
<link rel="stylesheet" href="/site.css">
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
<script src="/assets/backgrounds/backgrounds.js"></script>
</th:block>
</head>
<body>

<!-- nav(current): the inner pages' bar, the home page's bar in its own words. current is the page's id
     (how-it-works, history, settings, report, auth) and marks its word with aria-current. -->
<header class="nav nav--centre" th:fragment="nav(current)">
  <div class="wrap nav__bar">
    <a class="skip-link" href="#top">Skip to content</a>
    <a class="nav__logo" href="/"><span class="logo-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h4l3-8h6l3 8"/><circle cx="6" cy="19" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg></span>Allyscan</a>
    <nav class="nav__links" aria-label="Main">
      <div class="nav__item"><a class="nav__link" href="/how-it-works" th:attr="aria-current=${current == 'how-it-works'} ? 'page' : null">How it works</a></div>
      <div class="nav__item" sec:authorize="isAuthenticated()"><a class="nav__link" href="/account/scans" th:attr="aria-current=${current == 'history'} ? 'page' : null">My scans</a></div>
      <div class="nav__item"><a class="nav__link" href="/settings" th:attr="aria-current=${current == 'settings'} ? 'page' : null">Settings</a></div>
    </nav>
    <div class="nav__actions">
      <a class="nav__link" href="/login" sec:authorize="isAnonymous()" th:attr="aria-current=${current == 'login'} ? 'page' : null">Log in</a>
      <form method="post" th:action="@{/logout}" sec:authorize="isAuthenticated()" class="nav__logout"><button type="submit" class="nav__link link-button">Log out</button></form>
      <a class="btn btn--primary" href="/#scan">Scan a website</a>
    </div>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- foot: the inner pages' slim footer -->
<footer class="site-foot" th:fragment="foot">
  <div class="wrap">
    <a class="nav__logo" href="/"><span class="logo-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17h4l3-8h6l3 8"/><circle cx="6" cy="19" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg></span>Allyscan</a>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/how-it-works">How it works</a></li>
      <li><a href="/settings">Settings</a></li>
      <li><a href="https://www.ontario.ca/laws/regulation/110191" rel="noopener noreferrer" target="_blank">O. Reg. 191/11</a></li>
    </ul>
    <span>&copy; 2026 Allyscan</span>
  </div>
</footer>

<!-- scripts: the kit's runtime (nav sheet, hovers, presses, focus) on every page -->
<th:block th:fragment="scripts">
<script type="module" src="/assets/system.js"></script>
<script type="module" src="/assets/motion/motion.js"></script>
</th:block>

</body>
</html>
