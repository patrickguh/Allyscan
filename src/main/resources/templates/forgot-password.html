<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sky" data-buttons="tonal" data-motion
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:replace="~{fragments/site :: assets}"></th:block>
<title>Allyscan: forgot password</title>
<meta name="description" content="Request a 6-digit code to reset your Allyscan password.">
</head>
<body>
<header th:replace="~{fragments/site :: nav(current='login')}"></header>

<main id="top">
  <div class="page">
    <div class="wrap">
      <div class="split-2">
        <div class="page-head">
          <h1>Forgot your password?</h1>
          <p>Enter your account email and we will send a 6-digit code to reset it.</p>
        </div>
        <div class="box stack narrow">
          <form method="post" th:action="@{/forgot-password}" class="form form--1" aria-label="Send a reset code">
            <div class="field field--full">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required autofocus autocomplete="email" data-error="Write the email you signed up with">
            </div>
            <div class="btn-row"><button class="btn btn--primary btn--block" type="submit">Send reset code</button></div>
            <p class="form__status" data-form-status></p>
          </form>
          <p class="empty">Remembered it? <a href="/login">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/site :: foot}"></footer>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
</body>
</html>
