<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sky" data-buttons="tonal" data-motion
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:replace="~{fragments/site :: assets}"></th:block>
<title>Allyscan: reset password</title>
<meta name="description" content="Enter the 6-digit code from your email and choose a new Allyscan password.">
</head>
<body>
<header th:replace="~{fragments/site :: nav(current='login')}"></header>

<main id="top">
  <div class="page">
    <div class="wrap">
      <div class="split-2">
        <div class="page-head">
          <h1>Enter your reset code</h1>
          <p>The code in your email works once and runs out after a short time.</p>
        </div>
        <div class="box stack narrow">
          <div class="notice" role="status" th:if="${codeSent}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11v7h-11z"/><path d="m2.5 4.5 5.5 4 5.5-4"/></svg><p>If that email has an account, a 6-digit code is on its way. Enter it below.</p></div>
          <div class="notice notice--error" role="alert" th:if="${error}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.2v.1"/></svg><p th:text="${error}">Something went wrong.</p></div>
          <form method="post" th:action="@{/reset-password}" class="form form--1" aria-label="Reset your password">
            <div class="field field--full">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" th:value="${email}" required autofocus autocomplete="email" data-error="Write the email you signed up with">
            </div>
            <div class="field field--full">
              <label for="code">6-digit code</label>
              <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" data-error="Write the 6 digits from the email">
            </div>
            <div class="field field--full">
              <label for="password">New password, 8 characters or more</label>
              <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" data-error="Use at least 8 characters">
            </div>
            <div class="field field--full">
              <label for="confirm-password">Confirm new password</label>
              <input type="password" id="confirm-password" name="confirm-password" required minlength="8" autocomplete="new-password" data-error="Type the same password again">
            </div>
            <div class="btn-row"><button class="btn btn--primary btn--block" type="submit">Reset password</button></div>
            <p class="form__status" data-form-status></p>
          </form>
          <p class="empty">Didn't get a code? <a href="/forgot-password">Request another</a></p>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/site :: foot}"></footer>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
</body>
</html>
