<!doctype html>
<html lang="en" data-type="software" data-radius="sharp" data-ground="sky" data-buttons="tonal" data-motion
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:replace="~{fragments/site :: assets}"></th:block>
<title>Allyscan: my scans</title>
<meta name="description" content="Every accessibility scan you have run on Allyscan, private to your account.">
</head>
<body>
<header th:replace="~{fragments/site :: nav(current='history')}"></header>

<main id="top">
  <div class="page">
    <div class="wrap">
      <div class="split-2">
        <div class="page-head">
          <h1>My scans</h1>
          <p>Every scan you've submitted, private to your account.</p>
        </div>
        <div class="box stack">
          <div class="notice" role="status" th:if="${submittedId}"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg><p>Scan queued. It appears below and updates by itself once a worker picks it up.</p></div>
          <form class="form form--1" method="post" th:action="@{/account/scans}" aria-label="Start a new scan">
            <div class="field field--full">
              <label for="url">Website address</label>
              <input type="url" id="url" name="url" placeholder="https://" required autocomplete="url" data-error="Write the full address, starting with https://">
            </div>
            <div class="btn-row"><button class="btn btn--primary" type="submit">Scan a website</button></div>
            <p class="form__status" data-form-status></p>
          </form>
        </div>
      </div>
      <section class="block" aria-labelledby="history-h">
        <h2 id="history-h">Scan history</h2>
        <div th:replace="~{fragments/scan-history :: table(${jobs})}"></div>
      </section>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/site :: foot}"></footer>
<th:block th:replace="~{fragments/site :: scripts}"></th:block>
<script defer src="/app.js"></script>
</body>
</html>
